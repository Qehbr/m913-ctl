# m913-ctl macro examples -- Areson hardware (25a7:fa07 / 25a7:fa08)
# Apply with: m913-ctl --config examples/example_macros.ini
#
# The macro encoding was recovered from the vendor Windows software and
# confirmed on a real mouse. See docs/MACRO-PROTOCOL.md for the byte format.
#
# Applying this rewrites ALL 16 buttons, so run `m913-ctl --save before.ini`
# first if the mouse holds a setup you care about.

# -------------------------------------------------------------------------
# Macros
#
# Each button has its own macro region -- there is no pool of numbered macro
# slots -- so listing a button here also binds it to the macro. A button must
# not appear in both [macros] and [buttons].
#
#   ["name"] [repeat:] step[, step ...]
#
#   name    optional, up to 15 characters. Cosmetic: it is what the vendor
#           Windows software lists the macro under.
#   repeat  omitted = once, 1-253 = that many times,
#           hold    = repeat while the button is held
#                     (the vendor UI calls this "Cycle Until the Key Released")
#           toggle  = repeat until any key is pressed
#                     ("Cycle Until any key pressed")
#   step    click|down|up NAME [DELAY_MS]
#
# NAME resolves like a button action: mouse buttons first, then modifiers, then
# keys. So "left" is the mouse button and "arrow_left" is the arrow key.
# DELAY_MS is stored on each event the step generates; the firmware floor is 3.
# -------------------------------------------------------------------------
[macros]

# An autoclicker: hold the button, it keeps clicking every 20 ms. This is the
# thing the fire button cannot do -- `fire` is a burst of at most three clicks.
side1 = "AutoClick" hold: click left 20

# Press once and it clicks until you press any key, which stops it.
side2 = "ClickLatch" toggle: click left 50

# ctrl+c three times over, holding ctrl down across the whole run.
side3 = "CopyThrice" 3: down ctrl, click c 50, up ctrl

# A typed word with pauses between the keys. Modifiers work mid-macro, so the
# capital letter needs no special handling.
side4 = "SayHello" down shift, click h 60, up shift, click e 60, click l 60, click l 60, click o 60

# A double-click with a realistic gap, once per press.
side5 = "DoubleClick" click left 40, click left 40

# Middle-click then paste -- macros can mix mouse buttons and keys freely.
side6 = "MiddlePaste" click middle 30, down ctrl, click v 60, up ctrl

# A slow repeat: one space per second, twice.
side7 = "SlowSpace" 2: click space 1000

# -------------------------------------------------------------------------
# The remaining buttons. Every invocation writes all 16, so anything not
# mentioned here reverts to its factory default.
# -------------------------------------------------------------------------
[buttons]
button_left   = left
button_right  = right
button_middle = middle
button_fire   = fire:25:3
button_side8  = dpi+
button_side9  = dpi-
button_side10 = media_play
button_side11 = media_vol_up
button_side12 = led_toggle

[mouse]
polling_rate = 1000

[dpi]
dpi1 = 800
dpi2 = 1600
dpi3 = 3200
