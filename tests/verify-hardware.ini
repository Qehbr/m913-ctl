# Interactive verification config.
# Each binding exercises a different branch of build_button_mapping().
# Comments must be on their own line OR preceded by whitespace -- inline
# comments are now stripped, which this file also exercises.

[mouse]
polling_rate=500

[dpi]
dpi1=400
dpi2=1600
dpi3=3200
dpi4=6400
dpi5=12000

[led]
mode=steady
color=ff0000     ; inline comment -- must be stripped, colour must stay red
brightness=255
speed=3

[buttons]
button_left=left
button_right=right
button_middle=middle
button_fire=fire:58:3

# 3-token boundary cases -- the ones PR #5 is about
button_side1=ctrl+shift+z
button_side2=ctrl+a+b
button_side3=a+b+c

# other encoder paths
button_side4=super
button_side5=ctrl+c
button_side6=f5
button_side7=media_vol_up
button_side8=shift+tab

# new alias: plain "left" would be a mouse click, arrow_left is the arrow key
button_side9=arrow_left

button_side10=numplus
button_side11=media_play
button_side12=dpi-cycle
